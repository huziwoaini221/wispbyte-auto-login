name: Wispbyte Auto Login

on:
  schedule:
    # 每 12 天运行一次（比 14 天提前 2 天）
    - cron: '0 8 */12 * *'
  
  workflow_dispatch: # 允许手动触发

jobs:
  auto-login:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: |
          # 安装系统 Chrome 和依赖
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          # 安装 puppeteer-core（不下载 Chrome）
          npm install puppeteer-core
      
      - name: Run auto login
        env:
          WISPBYTE_EMAIL: ${{ secrets.WISPBYTE_EMAIL }}
          WISPBYTE_PASSWORD: ${{ secrets.WISPBYTE_PASSWORD }}
        run: node login.js
      
      - name: Send notification on failure
        if: failure()
        run: |
          echo "Wispbyte 自动登录失败！"
          echo "请检查 GitHub Secrets 中的 WISPBYTE_EMAIL 和 WISPBYTE_PASSWORD"
